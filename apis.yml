name: DocuTAP
description: 'DocuTAP was an urgent care EHR and practice-management software company based in Sioux Falls,
  South Dakota, backed by Bessemer Venture Partners. In 2019 DocuTAP merged with Practice Velocity to form
  Experity, the on-demand and urgent-care healthcare technology vendor. The DocuTAP EMR/PM product continues
  under the Experity portfolio, with customer sign-in at dtlogin.experityhealth.com; the legacy docutap.com
  domain is no longer actively maintained (its TLS certificate has expired). No public developer portal or
  API is currently published for DocuTAP.'
